name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare template (remove example code, set mod properties)
        run: |
          MODFILE=$(grep -rl '@Mod("' src/main/java | head -1)
          [ -n "$MODFILE" ] || { echo "No @Mod class found"; exit 1; }
          MODDIR=$(dirname "$MODFILE")
          MODID=$(sed -n 's/.*@Mod("\([^"]*\)").*/\1/p' "$MODFILE" | head -1)
          PKG=$(echo "$MODDIR" | sed 's|src/main/java/||; s|/|.|g')
          echo "mod id: $MODID, package: $PKG"
          find src/main/java -name '*.java' -not -path "$MODDIR/*" -delete
          find src/main/java -type d -empty -delete || true
          sed -i "s/^mod_id=.*/mod_id=$MODID/" gradle.properties
          sed -i "s/^mod_name=.*/mod_name=$MODID/" gradle.properties
          sed -i "s/^mod_group_id=.*/mod_group_id=$PKG/" gradle.properties
          sed -i "s/^mod_version=.*/mod_version=1.0.0/" gradle.properties
          grep -E '^(mod_|neo_version|minecraft_version)' gradle.properties
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: heavychop-jar
          path: build/libs/*.jar
